[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-outputer"
version = "0.1.0"
description = "輸入 Threads 帳號，抓取公開貼文並用 LLM 產生 YouTube 影片大綱"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.33.0"]

[project.scripts]
threads-outputer = "threads_outputer.cli:main"

[tool.setuptools]
packages = ["threads_outputer"]
